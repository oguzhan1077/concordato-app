version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - app_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=gK2VDL-2&2<I
      - DB_NAME=ilan_db
      - HEADLESS=true
    depends_on:
      - db
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - app_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app_network

  # MySQL Database
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=gK2VDL-2&2<I
      - MYSQL_DATABASE=ilan_db
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped
    networks:
      - app_network
    command: --default-authentication-plugin=mysql_native_password

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
    external: true
    name: concordato_db_data
